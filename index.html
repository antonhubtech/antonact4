<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        
        <h1>Student Grade Analyzer</h1>
        
      </header>

      <section class="panel">
        <h2>Add a Student</h2>
        <form id="student-form" class="student-form">
          <div class="field">
            <label for="student-name">Student Name</label>
            <input
              type="text"
              id="student-name"
              placeholder="Enter name"
              required
            />
          </div>
          <div class="field">
            <label for="student-mark">Mark</label>
            <input
              type="number"
              id="student-mark"
              min="0"
              max="100"
              placeholder="0–100"
              required
            />
          </div>
          <button type="submit" id="add-btn">Add Student</button>
        </form>
        <p id="form-msg" class="form-msg"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Student Records</h2>
          <span id="count-badge" class="badge">0 / 30</span>
        </div>
        <table id="student-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Student Name</th>
              <th>Marks</th>
              <th>Grade</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="student-tbody"></tbody>
        </table>
      </section>

      <section class="panel results">
        <h2>Results</h2>
        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-label">Average Marks</span>
            <span id="avg-marks" class="stat-value">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Average Letter Grade</span>
            <span id="avg-grade" class="stat-value">—</span>
          </div>
        </div>

        <h3>Above Average</h3>
        <p class="hint">
          Students with a mark higher than the class average (also logged to the
          console).
        </p>
        <ul id="above-avg-list" class="above-list">
          <li class="empty">Add students to see results.</li>
        </ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
